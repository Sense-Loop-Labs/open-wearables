services:
  db:
    image: postgres:18
    container_name: postgres__sense-loop-labs
    environment:
      POSTGRES_DB: sense-loop-labs
      POSTGRES_USER: sense-loop-labs
      POSTGRES_PASSWORD: sense-loop-labs
    ports:
      - "5435:5432"  # Use 5435 to avoid conflict with other instances
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sense-loop-labs -d sense-loop-labs"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_labs:/var/lib/postgresql

  app:
    build:
        context: ./backend
        dockerfile: Dockerfile
    container_name: backend__sense-loop-labs
    image: sense-loop-labs-platform:latest
    pull_policy: never
    command: scripts/start/app.sh
    env_file:
      - ./backend/config/.env
    environment:
      - DB_HOST=db
      - DB_NAME=sense-loop-labs
      - DB_USER=sense-loop-labs
      - DB_PASSWORD=sense-loop-labs
      - REDIS_HOST=redis__sense-loop-labs
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /root_project/app
        - action: sync
          path: ./backend/sense_loop
          target: /root_project/sense_loop
        - action: sync+restart
          path: ./backend/migrations
          target: /root_project/migrations
        - action: sync+restart
          path: ./backend/config/.env
          target: /root_project/config/.env
        - action: sync
          path: ./backend/scripts
          target: /root_project/scripts
        - action: sync
          path: ./backend/tests
          target: /root_project/tests
        - action: rebuild
          path: ./backend/uv.lock
    restart: on-failure

  celery-worker:
    container_name: celery-worker__sense-loop-labs
    image: sense-loop-labs-platform:latest
    pull_policy: never
    command: scripts/start/worker.sh
    env_file:
      - ./backend/config/.env
    environment:
      - DB_HOST=db
      - DB_NAME=sense-loop-labs
      - DB_USER=sense-loop-labs
      - DB_PASSWORD=sense-loop-labs
      - REDIS_HOST=redis__sense-loop-labs
    depends_on:
      - redis
      - db
      - app
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /root_project/app
        - action: sync+restart
          path: ./backend/sense_loop
          target: /root_project/sense_loop
        - action: sync
          path: ./backend/scripts
          target: /root_project/scripts

  celery-beat:
    container_name: celery-beat__sense-loop-labs
    image: sense-loop-labs-platform:latest
    pull_policy: never
    command: scripts/start/beat.sh
    env_file:
      - ./backend/config/.env
    environment:
      - DB_HOST=db
      - DB_NAME=sense-loop-labs
      - DB_USER=sense-loop-labs
      - DB_PASSWORD=sense-loop-labs
      - REDIS_HOST=redis__sense-loop-labs
    depends_on:
      - redis
      - db
      - app
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /root_project/app
        - action: sync+restart
          path: ./backend/sense_loop
          target: /root_project/sense_loop
        - action: sync
          path: ./backend/scripts
          target: /root_project/scripts

  flower:
    container_name: flower__sense-loop-labs
    image: sense-loop-labs-platform:latest
    pull_policy: never
    command: scripts/start/flower.sh
    env_file:
      - ./backend/config/.env
    environment:
      - DB_HOST=db
      - DB_NAME=sense-loop-labs
      - DB_USER=sense-loop-labs
      - DB_PASSWORD=sense-loop-labs
      - REDIS_HOST=redis__sense-loop-labs
    ports:
      - 5556:5555
    depends_on:
      - redis
      - db
      - app
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /root_project
          ignore:
            - .venv/

  redis:
    container_name: redis__sense-loop-labs
    image: redis:8
    ports:
      - "6381:6379"  # Use 6381 to avoid conflict with other instances
    volumes:
      - redis_data_labs:/var/lib/redis/data

  svix-server:
    container_name: svix-server__sense-loop-labs
    image: svix/svix-server:v1
    entrypoint:
      - sh
      - -c
      - |
        : "$${SVIX_JWT_SECRET:=$$SECRET_KEY}"
        export SVIX_JWT_SECRET
        exec svix-server "$$@"
      - --
    command: ["--run-migrations"]
    env_file:
      - ./backend/config/.env
    environment:
      SVIX_DB_DSN: "postgresql://sense-loop-labs:sense-loop-labs@db:5432/svix"
      SVIX_QUEUE_TYPE: "redis"
      SVIX_REDIS_DSN: "redis://redis__sense-loop-labs:6379/1"
      SVIX_CACHE_TYPE: "redis"
    ports:
      - "8072:8071"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "svix-server", "healthcheck", "http://localhost:8071"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend__sense-loop-labs
    image: sense-loop-labs-frontend:dev
    pull_policy: never
    ports:
      - "3002:3000"  # Use 3002 to avoid conflict with other instances
    depends_on:
      - app
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
        - action: rebuild
          path: ./frontend/vite.config.ts
    restart: on-failure

volumes:
  postgres_data_labs:
  redis_data_labs:

networks:
  default:
    name: sense-loop-labs